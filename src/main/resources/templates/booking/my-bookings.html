<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои заявки — Allur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-5">Allur — Тест-Драйв</span>
    <div class="d-flex gap-2">
        <a th:href="@{/booking/new}" class="btn btn-outline-light btn-sm">Новая заявка</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-light btn-sm" type="submit">Выйти</button>
        </form>
    </div>
</nav>

<div class="container mt-5 pb-5">
    <h4 class="fw-bold mb-4">Мои заявки</h4>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">
        У вас пока нет заявок.
        <a th:href="@{/booking/new}" class="text-danger fw-semibold">Записаться на тест-драйв →</a>
    </div>

    <div th:each="booking : ${bookings}" class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h6 class="fw-bold mb-1" th:text="${booking.firstName + ' ' + booking.lastName}"></h6>
                    <p class="mb-1 text-muted small">
                        <strong>Дата тест-драйва:</strong>
                        <span th:text="${booking.testDriveDate}"></span>
                    </p>
                    <p class="mb-1 text-muted small">
                        <strong>Место:</strong>
                        <span th:text="${booking.location}"></span>
                    </p>
                    <p class="mb-0 text-muted small">
                        <strong>Дата подачи:</strong>
                        <span th:text="${#temporals.format(booking.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                </div>
                <div>
                    <span th:if="${booking.status.name() == 'APPROVED'}"  class="badge bg-success fs-6 px-3 py-2">Одобрено</span>
                    <span th:if="${booking.status.name() == 'REJECTED'}"  class="badge bg-danger fs-6 px-3 py-2">Отклонено</span>
                    <span th:if="${booking.status.name() == 'PENDING'}"   class="badge bg-warning text-dark fs-6 px-3 py-2">На рассмотрении</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
