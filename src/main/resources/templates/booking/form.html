<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на тест-драйв — Allur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-5">Allur — Тест-Драйв</span>
    <div class="d-flex align-items-center gap-2">
        <a th:href="@{/booking/my}" class="btn btn-outline-light btn-sm">Мои заявки</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-light btn-sm" type="submit">Выйти</button>
        </form>
    </div>
</nav>

<div class="container mt-5 pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0 fw-bold">Заявка на тест-драйв</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

                    <form th:action="@{/booking/new}" method="post" enctype="multipart/form-data">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Имя</label>
                                <input type="text" name="firstName" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Фамилия</label>
                                <input type="text" name="lastName" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Номер телефона</label>
                            <input type="tel" name="phone" class="form-control"
                                   placeholder="+7 XXX XXX XX XX" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Дата тест-драйва</label>
                            <input type="date" name="testDriveDate" id="testDriveDate"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Место</label>
                            <select name="location" class="form-select" required>
                                <option value="">— Выберите место —</option>
                                <option value="Астана, Туран 51">Астана, Туран 51</option>
                                <option value="Астана, Туран 59/4">Астана, Туран 59/4</option>
                                <option value="Алматы, Майлина 240а">Алматы, Майлина 240а</option>
                                <option value="Алматы, Суюнбая 159а">Алматы, Суюнбая 159а</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Водительское удостоверение</label>
                            <input type="file" name="licenseFile" class="form-control"
                                   accept=".jpg,.jpeg,.png,.pdf" required>
                            <div class="form-text">Фото или скан ВУ — JPG, PNG или PDF (до 10 МБ)</div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                            Отправить заявку
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Минимальная дата — завтра
    const input = document.getElementById('testDriveDate');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    input.min = tomorrow.toISOString().split('T')[0];
</script>

</body>
</html>
