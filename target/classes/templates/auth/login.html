<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Allur Тест-Драйв</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Allur</h2>
            <p class="text-muted mb-0">Запись на тест-драйв</p>
        </div>

        <div th:if="${param.registered}" class="alert alert-success py-2">
            Регистрация прошла успешно! Войдите в аккаунт.
        </div>
        <div th:if="${param.logout}" class="alert alert-secondary py-2">
            Вы вышли из системы.
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2">
            Неверный email или пароль.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="username" class="form-control" placeholder="example@mail.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2">Войти</button>
        </form>

        <hr class="my-3">
        <p class="text-center mb-0 text-muted">
            Нет аккаунта? <a th:href="@{/register}" class="text-danger fw-semibold">Зарегистрироваться</a>
        </p>
    </div>
</div>
</body>
</html>
