<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Allur Тест-Драйв</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow p-4" style="width: 100%; max-width: 480px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Allur</h2>
            <p class="text-muted mb-0">Создать аккаунт</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-semibold">Имя</label>
                    <input type="text" th:field="*{firstName}" class="form-control" required>
                    <div class="text-danger small mt-1" th:errors="*{firstName}"></div>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-semibold">Фамилия</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required>
                    <div class="text-danger small mt-1" th:errors="*{lastName}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
                <div class="text-danger small mt-1" th:errors="*{email}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Пароль</label>
                <input type="password" th:field="*{password}" class="form-control" required>
                <div class="form-text">Минимум 6 символов</div>
                <div class="text-danger small mt-1" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2">Зарегистрироваться</button>
        </form>

        <hr class="my-3">
        <p class="text-center mb-0 text-muted">
            Уже есть аккаунт? <a th:href="@{/login}" class="text-danger fw-semibold">Войти</a>
        </p>
    </div>
</div>
</body>
</html>
