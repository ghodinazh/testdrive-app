<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявка отправлена — Allur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-5">Allur — Тест-Драйв</span>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-light btn-sm" type="submit">Выйти</button>
    </form>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 70px);">
    <div class="card shadow text-center p-5" style="max-width: 480px; width: 100%;">
        <div style="font-size: 4rem; color: #28a745;">✓</div>
        <h4 class="fw-bold mt-3">Заявка отправлена!</h4>
        <p class="text-muted mt-2">
            Ваша заявка принята на рассмотрение. Как только она будет одобрена,
            вам придёт уведомление на email.
        </p>
        <div class="d-flex gap-2 justify-content-center mt-3">
            <a th:href="@{/booking/my}" class="btn btn-danger">Мои заявки</a>
            <a th:href="@{/booking/new}" class="btn btn-outline-secondary">Новая заявка</a>
        </div>
    </div>
</div>

</body>
</html>
